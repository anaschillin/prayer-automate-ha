alias: Maghrib adhan
description: Maghrib adhan on speaker
triggers:
  - trigger: template
    value_template: >-
      {% set maghrib_time = as_timestamp(states("sensor.maghrib_adhan")) |
      timestamp_custom("%H:%M", True) %}
            {% set time = states("sensor.time")  %}
            {{ time == maghrib_time }}
conditions: []
actions:
  - action: media_player.play_media
    metadata: {}
    data:
      media:
        media_content_id: media-source://media_source/local/azan-short.mp3
        media_content_type: audio/mpeg
        metadata:
          title: azan-short.mp3
          thumbnail: null
          media_class: music
          children_media_class: null
          navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
          browse_entity_id: media_player.flat_nest
    target:
      device_id: 474ce9724d0c58bc9df8395e2082f477
mode: single
