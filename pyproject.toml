[project]
name = "prayer-automate"
version = "0.1.0"
description = "Extract daily prayer times from PDF timetables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.4",
]

[project.scripts]
prayer-extract = "prayer_automate.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
